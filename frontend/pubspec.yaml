name: ai_tourist_app
description: AI Travel Guide — location-aware AI voiceover for tourist spots, with group travel and walkie-talkie.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management + routing
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.0

  # Networking
  dio: ^5.4.3+1

  # Secure storage / crypto
  flutter_secure_storage: ^9.2.2
  encrypt: ^5.0.3
  crypto: ^3.0.3

  # Location + map
  geolocator: ^11.1.0
  google_maps_flutter: ^2.7.0

  # Realtime
  web_socket_channel: ^3.0.0
  flutter_webrtc: ^0.11.8

  # Notifications
  firebase_messaging: ^15.0.4

  # Social auth
  flutter_appauth: ^7.1.1

  # Misc
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  integration_test:
    sdk: flutter
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/