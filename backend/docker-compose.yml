# Postgres + PostGIS dev database for the AI Travel Guide backend.
# Usage: docker compose up -d && npm run migrate
version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: aitg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_travel_guide
    ports:
      - "5432:5432"
    volumes:
      - aitg_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_travel_guide"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aitg-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  aitg_pg_data: